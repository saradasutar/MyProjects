<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyProjects Dashboard</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --light: #ecf0f1;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; background: #f4f7f6; }
    
    /* Sidebar Navigation */
    .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; padding: 20px 0; }
    .sidebar h2 { text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 20px; }
    .nav-btn { display: block; width: 100%; padding: 15px 20px; background: none; border: none; color: white; text-align: left; cursor: pointer; font-size: 16px; }
    .nav-btn:hover { background: var(--secondary); }

    /* Main Content Area */
    .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
    .section { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .section.active { display: block; }
    
    /* Forms & Inputs */
    input, select, textarea { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button.submit-btn { background: var(--secondary); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button.submit-btn:hover { background: #2980b9; }

    /* Project Cards */
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1px)); gap: 20px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; border-left: 5px solid var(--secondary); }
    
    /* Improved Book Editor */
    .book-editor { height: 400px; resize: vertical; font-family: Georgia, serif; font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Workspace</h2>
    <button class="nav-btn" onclick="showSection('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="showSection('new-project')">➕ New Project</button>
    <button class="nav-btn" onclick="showSection('book-writing')">📖 Book Writing</button>
    <button class="nav-btn" onclick="showSection('brainstorm')">💡 Brainstorming</button>
    <a href="https://saradasutar.github.io/MyTrip/#" style="text-decoration: none;"><button class="nav-btn">🔒 Lock / Logout</button></a>
  </div>

  <div class="main-content">
    
    <div id="dashboard" class="section active">
      <h1>Active Projects</h1>
      <button class="submit-btn" onclick="loadProjects()">Refresh Data</button>
      <div class="project-grid" id="project-list">
        <div class="card">
          <h3>Sarni Channel Setup</h3>
          <p><strong>Type:</strong> YouTube</p>
          <p><strong>Partner:</strong> Niharika</p>
          <p><strong>Progress:</strong> 35%</p>
        </div>
      </div>
    </div>

    <div id="new-project" class="section">
      <h1>Launch New Project</h1>
      <input type="text" id="proj-name" placeholder="Project Name (e.g., App Dev, React Course)">
      <select id="proj-cat">
        <option value="YouTube">YouTube Content</option>
        <option value="AppDev">App Development</option>
        <option value="Website">Website Creation</option>
        <option value="Social">Instagram/Facebook/X</option>
      </select>
      <input type="text" id="proj-partner" placeholder="Partner Name (Leave blank if solo)">
      <button class="submit-btn" onclick="submitProject()">Save Project</button>
    </div>

    <div id="book-writing" class="section">
      <h1>SarNi Publishing: Drafting</h1>
      <input type="text" id="chap-title" placeholder="Chapter Title">
      <textarea id="chap-content" class="book-editor" placeholder="Start writing your draft here..."></textarea>
      <button class="submit-btn" onclick="saveChapter()">Save Draft to Cloud</button>
    </div>

    <div id="brainstorm" class="section">
      <h1>Collaborative Brainstorming</h1>
      <textarea id="idea-text" rows="5" placeholder="What's the next big idea?"></textarea>
      <button class="submit-btn">Log Idea</button>
    </div>

  </div>

  <script>
    // REPLACE THIS WITH YOUR NEW APPS SCRIPT WEB APP URL
    const SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE'; 

    // Navigation logic
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    // Submit a new project to Google Sheets
    function submitProject() {
      const payload = {
        action: "addProject",
        name: document.getElementById('proj-name').value,
        category: document.getElementById('proj-cat').value,
        partner: document.getElementById('proj-partner').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        alert("Project saved successfully!");
        document.getElementById('proj-name').value = '';
      })
      .catch(error => alert("Error saving project."));
    }

    // Save a book chapter
    function saveChapter() {
      const payload = {
        action: "saveChapter",
        chapter: "Auto", 
        title: document.getElementById('chap-title').value,
        content: document.getElementById('chap-content').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(response => {
        alert("Draft synced to Google Sheets!");
      });
    }

    // Load projects from Google Sheets
    function loadProjects() {
      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          const grid = document.getElementById('project-list');
          grid.innerHTML = ''; // clear loading state
          data.forEach(proj => {
            grid.innerHTML += `
              <div class="card">
                <h3>${proj.ProjectName}</h3>
                <p><strong>Type:</strong> ${proj.Category}</p>
                <p><strong>Partner:</strong> ${proj.Partner || 'Solo'}</p>
                <p><strong>Progress:</strong> ${proj.Progress}</p>
              </div>
            `;
          });
        });
    }
  </script>
</body>
</html>
