<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyProjects — Studio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211934;
    --ink-soft:#342A4E;
    --paper:#FAF7F2;
    --card:#FFFFFF;
    --line:#E7E1D8;
    --amber:#D9A441;
    --amber-dark:#B9852B;
    --sage:#6F9C8B;
    --rust:#C1553C;
    --text:#241C33;
    --text-dim:#6B637C;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--text);}
  h1,h2,h3,.brand{font-family:'Fraunces',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 20% 20%, #2E2350 0%, var(--ink) 55%);}
  .login-card{background:var(--card);width:360px;max-width:90vw;padding:40px 34px;border-radius:14px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);}
  .login-card .brand{font-size:26px;font-weight:600;color:var(--ink);margin:0;}
  .login-card .tag{color:var(--text-dim);font-size:13px;margin:4px 0 28px;letter-spacing:.02em;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:#fff;color:var(--text);}
  .field input:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .btn-primary{width:100%;padding:12px;border:none;border-radius:8px;background:var(--ink);color:#fff;
    font-size:14px;font-weight:600;margin-top:6px;}
  .btn-primary:hover{background:var(--ink-soft);}
  .login-error{color:var(--rust);font-size:13px;margin-top:12px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;}
  .app-layout{display:flex;min-height:100vh;}

  .sidebar{width:230px;flex-shrink:0;background:var(--ink);color:#EDE7F6;padding:26px 16px;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sidebar .brand{font-size:20px;color:#fff;margin:0 6px 2px;}
  .sidebar .tag{font-size:11px;color:#B7ADCF;margin:0 6px 26px;letter-spacing:.03em;}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:none;
    border:none;border-radius:8px;color:#D8D0EC;text-align:left;font-size:14px;margin-bottom:3px;}
  .nav-btn:hover{background:rgba(255,255,255,.06);}
  .nav-btn.active{background:var(--amber);color:var(--ink);font-weight:600;}
  .sidebar-spacer{flex:1;}
  .who{font-size:12px;color:#B7ADCF;padding:0 12px 10px;}
  .who strong{color:#fff;display:block;font-size:14px;margin-bottom:2px;}
  .logout-btn{width:100%;padding:10px 12px;background:rgba(255,255,255,.08);border:none;border-radius:8px;
    color:#EDE7F6;font-size:13px;}
  .logout-btn:hover{background:rgba(255,255,255,.15);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;
    border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
  .topbar h1{font-size:22px;margin:0;color:var(--ink);}
  .topbar-actions{display:flex;gap:10px;}
  .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);
    font-size:13px;font-weight:600;}
  .btn:hover{border-color:var(--ink);}
  .btn-amber{background:var(--amber);border-color:var(--amber);color:var(--ink);}
  .btn-amber:hover{background:var(--amber-dark);border-color:var(--amber-dark);}

  .content{padding:28px 32px 60px;}
  .section{display:none;}
  .section.active{display:block;}

  /* filter tabs */
  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;
    color:var(--text-dim);}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;}
  .card .cat{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#F1ECE0;
    color:var(--text-dim);margin-bottom:10px;}
  .card h3{margin:0 0 4px;font-size:17px;color:var(--ink);}
  .card .meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;}
  .progress-track{height:7px;border-radius:5px;background:#EFE9DD;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;background:var(--sage);border-radius:5px;}
  .progress-label{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;}
  .status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:10px;
    display:inline-block;}
  .status-Planning{background:#F1ECE0;color:#8A7C55;}
  .status-Active{background:#E6F0EC;color:var(--sage);}
  .status-Paused{background:#F5E6E1;color:var(--rust);}
  .status-Done{background:#E5E9F5;color:#4A5FA6;}
  .card-actions{margin-top:12px;display:flex;gap:8px;}
  .card-actions input[type=range]{flex:1;}

  /* forms */
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;
    max-width:520px;}
  .field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;resize:vertical;}
  .field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:#fff;}

  /* books */
  .book-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px;}
  .book-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;}
  .book-card:hover{border-color:var(--amber);}
  .book-card h3{margin:0 0 4px;font-size:16px;}
  .book-card .meta{font-size:12px;color:var(--text-dim);}
  .editor-shell{display:none;}
  .editor-shell.active{display:block;}
  .chapter-list{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .chapter-pill{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;}
  .chapter-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .book-editor{width:100%;height:420px;padding:20px;border:1px solid var(--line);border-radius:10px;
    font-family:'Fraunces',Georgia,serif;font-size:17px;line-height:1.7;resize:vertical;}
  .editor-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    font-size:12.5px;color:var(--text-dim);}

  /* ideas */
  .idea-item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:8px;padding:12px 16px;margin-bottom:10px;}
  .idea-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  /* sticky panel */
  #sticky-toggle{position:fixed;right:24px;bottom:24px;width:54px;height:54px;border-radius:50%;
    background:var(--amber);border:none;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:22px;z-index:20;}
  #sticky-panel{position:fixed;top:0;right:-360px;width:340px;height:100vh;background:var(--card);
    box-shadow:-8px 0 30px rgba(0,0,0,.15);transition:right .25s ease;padding:24px 20px;overflow-y:auto;
    z-index:25;}
  #sticky-panel.open{right:0;}
  #sticky-panel h2{font-size:18px;margin:0 0 4px;}
  #sticky-panel .sub{font-size:12px;color:var(--text-dim);margin-bottom:18px;}
  .sticky-note{background:#FFF8E6;border:1px solid #F0DFA8;border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .sticky-note .txt{font-size:13.5px;color:var(--text);margin-bottom:6px;}
  .sticky-note .meta{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;}
  .sticky-note .actions{margin-top:8px;display:flex;gap:6px;}
  .mini-btn{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;}
  .mini-btn:hover{border-color:var(--ink);}
  .close-panel{position:absolute;top:18px;right:18px;background:none;border:none;font-size:18px;
    color:var(--text-dim);}
  .add-sticky-form{margin-top:10px;}
  .add-sticky-form input,.add-sticky-form textarea{width:100%;margin-bottom:8px;padding:9px 10px;
    border:1px solid var(--line);border-radius:7px;font-size:13px;}
  .empty{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}

  @media(max-width:760px){
    .sidebar{position:fixed;left:-230px;transition:left .2s;z-index:30;}
    .sidebar.open{left:0;}
    .content{padding:20px;}
    .topbar{padding:16px 20px;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <p class="brand">MyProjects</p>
    <p class="tag">Studio dashboard · websites · apps · books · content</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button class="btn-primary" onclick="login()">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-screen">
  <div class="app-layout">
    <div class="sidebar" id="sidebar">
      <p class="brand">MyProjects</p>
      <p class="tag">Studio Dashboard</p>
      <button class="nav-btn active" data-section="dashboard" onclick="showSection('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" data-section="new-project" onclick="showSection('new-project')">➕ New Project</button>
      <button class="nav-btn" data-section="book-writing" onclick="showSection('book-writing')">📖 Book Writing</button>
      <button class="nav-btn" data-section="ideas" onclick="showSection('ideas')">💡 Ideas</button>
      <div class="sidebar-spacer"></div>
      <div class="who"><strong id="who-name">—</strong>Signed in</div>
      <button class="logout-btn" onclick="logout()">↪ Sign out</button>
    </div>

    <div class="main">
      <div class="topbar">
        <h1 id="topbar-title">Active Projects</h1>
        <div class="topbar-actions">
          <button class="btn" onclick="loadDashboard()">↻ Refresh</button>
          <button class="btn btn-amber" onclick="showSection('new-project')">+ Project</button>
        </div>
      </div>

      <div class="content">

        <!-- Dashboard -->
        <div id="dashboard" class="section active">
          <div class="tabs" id="category-tabs">
            <button class="tab active" data-cat="All" onclick="filterCategory('All')">All</button>
            <button class="tab" data-cat="Website" onclick="filterCategory('Website')">🌐 Websites</button>
            <button class="tab" data-cat="AppDev" onclick="filterCategory('AppDev')">📱 App Dev</button>
            <button class="tab" data-cat="Book" onclick="filterCategory('Book')">✍️ Books</button>
            <button class="tab" data-cat="YouTube" onclick="filterCategory('YouTube')">▶ YouTube</button>
            <button class="tab" data-cat="Social" onclick="filterCategory('Social')">📣 Instagram/FB</button>
          </div>
          <div class="project-grid" id="project-list">
            <p class="empty">Loading projects…</p>
          </div>
        </div>

        <!-- New Project -->
        <div id="new-project" class="section">
          <div class="form-card">
            <h2>Launch a new project</h2>
            <div class="field">
              <label>Project name</label>
              <input type="text" id="proj-name" placeholder="e.g. Sarni Channel, Odia Cookbook site">
            </div>
            <div class="field">
              <label>Category</label>
              <select id="proj-cat">
                <option value="Website">Website</option>
                <option value="AppDev">App Development</option>
                <option value="Book">Book Writing</option>
                <option value="YouTube">YouTube Content</option>
                <option value="Social">Instagram / Facebook</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label>Partner (leave blank if solo)</label>
              <input type="text" id="proj-partner" placeholder="e.g. Niharika">
            </div>
            <div class="field">
              <label>Target date</label>
              <input type="date" id="proj-target">
            </div>
            <div class="field">
              <label>Notes</label>
              <textarea id="proj-desc" rows="3" placeholder="What's the goal here?"></textarea>
            </div>
            <button class="btn btn-amber" onclick="submitProject()">Save project</button>
          </div>
        </div>

        <!-- Book Writing -->
        <div id="book-writing" class="section">
          <div id="book-library">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 style="margin:0;">Your books</h2>
              <button class="btn" onclick="toggleNewBookForm()">+ New book</button>
            </div>
            <div class="form-card" id="new-book-form" style="display:none;margin-bottom:20px;">
              <div class="field"><label>Title</label><input type="text" id="book-title"></div>
              <div class="field"><label>Genre</label><input type="text" id="book-genre" placeholder="e.g. Family memoir, Odia recipes"></div>
              <div class="field"><label>Author(s)</label><input type="text" id="book-authors"></div>
              <div class="field"><label>Synopsis</label><textarea id="book-synopsis" rows="3"></textarea></div>
              <button class="btn btn-amber" onclick="addBook()">Create book</button>
            </div>
            <div class="book-list" id="book-list"><p class="empty">Loading books…</p></div>
          </div>

          <div class="editor-shell" id="editor-shell">
            <button class="btn" onclick="closeEditor()">← Back to books</button>
            <h2 id="editor-book-title" style="margin:16px 0 4px;"></h2>
            <div class="chapter-list" id="chapter-list"></div>
            <button class="btn" onclick="newChapter()">+ New chapter</button>
            <div class="field" style="margin-top:14px;">
              <label>Chapter title</label>
              <input type="text" id="chap-title" placeholder="Chapter title">
            </div>
            <textarea id="chap-content" class="book-editor" placeholder="Start writing…"></textarea>
            <div class="editor-meta">
              <span id="word-count">0 words</span>
              <button class="btn btn-amber" onclick="saveChapter()">Save draft to cloud</button>
            </div>
          </div>
        </div>

        <!-- Ideas -->
        <div id="ideas" class="section">
          <div class="form-card" style="margin-bottom:24px;">
            <h2>Log an idea</h2>
            <div class="field">
              <textarea id="idea-text" rows="3" placeholder="What's the next big idea?"></textarea>
            </div>
            <div class="field">
              <select id="idea-cat">
                <option value="General">General</option>
                <option value="Website">Website</option>
                <option value="AppDev">App Dev</option>
                <option value="Book">Book</option>
                <option value="YouTube">YouTube</option>
                <option value="Social">Social</option>
              </select>
            </div>
            <button class="btn btn-amber" onclick="addIdea()">Log idea</button>
          </div>
          <div id="idea-list"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ================= Sticky notes ================= -->
<button id="sticky-toggle" onclick="toggleStickyPanel()" title="Sticky notes">📌</button>
<div id="sticky-panel">
  <button class="close-panel" onclick="toggleStickyPanel()">✕</button>
  <h2>Sticky notes</h2>
  <p class="sub">Targets and reminders, shared across everyone's dashboard.</p>
  <div class="add-sticky-form">
    <textarea id="sticky-text" rows="2" placeholder="Reminder or target…"></textarea>
    <input type="date" id="sticky-date">
    <button class="btn btn-amber" style="width:100%;" onclick="addSticky()">+ Add sticky</button>
  </div>
  <div id="sticky-active" style="margin-top:18px;"></div>
  <div style="margin-top:22px;">
    <h3 style="font-size:14px;margin-bottom:8px;">Completed</h3>
    <div id="sticky-done"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUJVYozVwDFhHlyn8bEoUAZeCMpJWlglc2NGwmLNbme1cDnxk-Gas9YnD5ml0YlCGvwg/exec';

let TOKEN = localStorage.getItem('mp_token') || null;
let DISPLAY_NAME = localStorage.getItem('mp_name') || null;
let STATE = { projects: [], stickies: [], ideas: [], books: [], chapters: [], activeCat: 'All', currentBook: null, currentChapterId: null };

/* ---------- api ---------- */
function api(payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: TOKEN }, payload))
  }).then(r => r.json());
}

/* ---------- auth ---------- */
function login() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'Enter a username and password.'; return; }

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'login', username: username, password: password })
  }).then(r => r.json()).then(data => {
    if (!data.success) { errEl.textContent = data.error || 'Login failed.'; return; }
    TOKEN = data.token; DISPLAY_NAME = data.displayName;
    localStorage.setItem('mp_token', TOKEN);
    localStorage.setItem('mp_name', DISPLAY_NAME);
    enterApp();
  }).catch(() => { errEl.textContent = 'Could not reach the server. Try again.'; });
}

function logout() {
  localStorage.removeItem('mp_token');
  localStorage.removeItem('mp_name');
  TOKEN = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('who-name').textContent = DISPLAY_NAME;
  loadDashboard();
}

/* ---------- nav ---------- */
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === id));
  const titles = { dashboard: 'Active Projects', 'new-project': 'New Project', 'book-writing': 'Book Writing', ideas: 'Ideas & Brainstorm' };
  document.getElementById('topbar-title').textContent = titles[id] || '';
}

/* ---------- dashboard load ---------- */
function loadDashboard() {
  api({ action: 'getDashboard' }).then(data => {
    if (!data.success) { if (data.error && data.error.indexOf('expired') > -1) logout(); return; }
    STATE.projects = data.projects || [];
    STATE.stickies = data.stickies || [];
    STATE.ideas = data.ideas || [];
    STATE.books = data.books || [];
    renderProjects();
    renderStickies();
    renderIdeas();
    renderBooks();
  });
}

/* ---------- projects ---------- */
function filterCategory(cat) {
  STATE.activeCat = cat;
  document.querySelectorAll('#category-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderProjects();
}

function renderProjects() {
  const grid = document.getElementById('project-list');
  const list = STATE.activeCat === 'All' ? STATE.projects : STATE.projects.filter(p => p.Category === STATE.activeCat);
  if (!list.length) { grid.innerHTML = '<p class="empty">No projects yet in this category — start one!</p>'; return; }
  const catLabel = { Website: '🌐 Website', AppDev: '📱 App Dev', Book: '✍️ Book', YouTube: '▶ YouTube', Social: '📣 Social', Other: '🗂 Other' };
  grid.innerHTML = list.map(p => `
    <div class="card">
      <span class="cat">${catLabel[p.Category] || p.Category}</span>
      <h3>${esc(p.Name)}</h3>
      <div class="meta">${p.Partner ? 'With ' + esc(p.Partner) : 'Solo'} · Owner: ${esc(p.Owner)}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${p.Progress || 0}%;"></div></div>
      <div class="progress-label"><span>${p.Progress || 0}% done</span><span>${p.TargetDate ? fmtDate(p.TargetDate) : ''}</span></div>
      <span class="status-pill status-${p.Status || 'Planning'}">${p.Status || 'Planning'}</span>
      <div class="card-actions">
        <input type="range" min="0" max="100" value="${p.Progress || 0}" onchange="bumpProgress('${p.ProjectID}', this.value)">
      </div>
    </div>
  `).join('');
}

function bumpProgress(projectId, value) {
  api({ action: 'updateProject', projectId: projectId, progress: Number(value), status: Number(value) >= 100 ? 'Done' : undefined })
    .then(() => loadDashboard());
}

function submitProject() {
  const name = document.getElementById('proj-name').value.trim();
  if (!name) { alert('Give the project a name first.'); return; }
  api({
    action: 'addProject',
    name: name,
    category: document.getElementById('proj-cat').value,
    partner: document.getElementById('proj-partner').value,
    targetDate: document.getElementById('proj-target').value,
    description: document.getElementById('proj-desc').value
  }).then(() => {
    document.getElementById('proj-name').value = '';
    document.getElementById('proj-partner').value = '';
    document.getElementById('proj-desc').value = '';
    showSection('dashboard');
    loadDashboard();
  });
}

/* ---------- sticky notes ---------- */
function toggleStickyPanel() { document.getElementById('sticky-panel').classList.toggle('open'); }

function renderStickies() {
  const active = STATE.stickies.filter(s => s.Status !== 'done');
  const done = STATE.stickies.filter(s => s.Status === 'done');
  const activeEl = document.getElementById('sticky-active');
  const doneEl = document.getElementById('sticky-done');

  activeEl.innerHTML = active.length ? active.map(s => `
    <div class="sticky-note">
      <div class="txt">${esc(s.Text)}</div>
      <div class="meta"><span>${esc(s.CreatedBy)}</span><span>${s.TargetDate ? fmtDate(s.TargetDate) : ''}</span></div>
      <div class="actions">
        <button class="mini-btn" onclick="completeSticky('${s.NoteID}')">✓ Done</button>
        <button class="mini-btn" onclick="deleteSticky('${s.NoteID}')">✕ Remove</button>
      </div>
    </div>`).join('') : '<p class="empty">No active reminders.</p>';

  doneEl.innerHTML = done.length ? done.slice(-8).reverse().map(s => `
    <div class="sticky-note" style="opacity:.6;">
      <div class="txt" style="text-decoration:line-through;">${esc(s.Text)}</div>
      <div class="meta"><span>${esc(s.CreatedBy)}</span><span>${s.CompletedDate ? fmtDate(s.CompletedDate) : ''}</span></div>
    </div>`).join('') : '<p class="empty">Nothing completed yet.</p>';
}

function addSticky() {
  const text = document.getElementById('sticky-text').value.trim();
  if (!text) return;
  api({ action: 'addSticky', text: text, targetDate: document.getElementById('sticky-date').value })
    .then(() => { document.getElementById('sticky-text').value = ''; loadDashboard(); });
}
function completeSticky(id) { api({ action: 'completeSticky', noteId: id }).then(loadDashboard); }
function deleteSticky(id) { api({ action: 'deleteSticky', noteId: id }).then(loadDashboard); }

/* ---------- ideas ---------- */
function renderIdeas() {
  const el = document.getElementById('idea-list');
  el.innerHTML = STATE.ideas.length ? STATE.ideas.map(i => `
    <div class="idea-item">
      <div>${esc(i.Text)}</div>
      <div class="meta">${esc(i.Category)} · ${esc(i.CreatedBy)} · ${i.CreatedDate ? fmtDate(i.CreatedDate) : ''}</div>
    </div>`).join('') : '<p class="empty">No ideas logged yet.</p>';
}
function addIdea() {
  const text = document.getElementById('idea-text').value.trim();
  if (!text) return;
  api({ action: 'addIdea', text: text, category: document.getElementById('idea-cat').value })
    .then(() => { document.getElementById('idea-text').value = ''; loadDashboard(); });
}

/* ---------- books ---------- */
function toggleNewBookForm() {
  const f = document.getElementById('new-book-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
function renderBooks() {
  const el = document.getElementById('book-list');
  el.innerHTML = STATE.books.length ? STATE.books.map(b => `
    <div class="book-card" onclick="openBook('${b.BookID}','${escAttr(b.Title)}')">
      <h3>${esc(b.Title)}</h3>
      <div class="meta">${esc(b.Genre || '')}${b.Genre ? ' · ' : ''}${esc(b.Authors || '')}</div>
      <div class="meta">${esc(b.Status || 'Drafting')}</div>
    </div>`).join('') : '<p class="empty">No books yet — start one above.</p>';
}
function addBook() {
  const title = document.getElementById('book-title').value.trim();
  if (!title) { alert('Give the book a title first.'); return; }
  api({
    action: 'addBook', title: title,
    genre: document.getElementById('book-genre').value,
    authors: document.getElementById('book-authors').value,
    synopsis: document.getElementById('book-synopsis').value
  }).then(() => {
    document.getElementById('book-title').value = '';
    document.getElementById('book-genre').value = '';
    document.getElementById('book-authors').value = '';
    document.getElementById('book-synopsis').value = '';
    toggleNewBookForm();
    loadDashboard();
  });
}

function openBook(bookId, title) {
  STATE.currentBook = bookId;
  document.getElementById('book-library').style.display = 'none';
  document.getElementById('editor-shell').classList.add('active');
  document.getElementById('editor-book-title').textContent = title;
  api({ action: 'getBookDetail', bookId: bookId }).then(data => {
    STATE.chapters = data.chapters || [];
    renderChapterList();
    if (STATE.chapters.length) loadChapterIntoEditor(STATE.chapters[0]);
    else newChapter();
  });
}
function closeEditor() {
  document.getElementById('book-library').style.display = 'block';
  document.getElementById('editor-shell').classList.remove('active');
}
function renderChapterList() {
  const el = document.getElementById('chapter-list');
  el.innerHTML = STATE.chapters.map(c => `
    <button class="chapter-pill ${c.ChapterID === STATE.currentChapterId ? 'active' : ''}"
      onclick='loadChapterIntoEditor(${JSON.stringify(c)})'>${esc(c.Title || 'Untitled')}</button>
  `).join('');
}
function loadChapterIntoEditor(c) {
  STATE.currentChapterId = c.ChapterID;
  document.getElementById('chap-title').value = c.Title || '';
  document.getElementById('chap-content').value = c.Content || '';
  updateWordCount();
  renderChapterList();
}
function newChapter() {
  STATE.currentChapterId = null;
  document.getElementById('chap-title').value = '';
  document.getElementById('chap-content').value = '';
  updateWordCount();
}
document.addEventListener('input', e => { if (e.target.id === 'chap-content') updateWordCount(); });
function updateWordCount() {
  const text = document.getElementById('chap-content').value.trim();
  const words = text ? text.split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words + ' words';
}
function saveChapter() {
  const title = document.getElementById('chap-title').value.trim();
  const content = document.getElementById('chap-content').value;
  if (!title) { alert('Give the chapter a title first.'); return; }
  api({
    action: 'saveChapter', bookId: STATE.currentBook, chapterId: STATE.currentChapterId,
    chapterNo: STATE.chapters.length + 1, title: title, content: content
  }).then(data => {
    STATE.currentChapterId = data.chapterId;
    api({ action: 'getBookDetail', bookId: STATE.currentBook }).then(d => {
      STATE.chapters = d.chapters || [];
      renderChapterList();
    });
  });
}

/* ---------- utils ---------- */
function esc(s) { return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s) { return esc(s).replace(/'/g, "\\'"); }
function fmtDate(d) { const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }

/* ---------- boot ---------- */
if (TOKEN) enterApp(); 
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
